context:
  version: "0.1.0"

package:
  name: mojo-wyhash
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo
    - mojo precompile src/wyhash -o ${{ PREFIX }}/lib/mojo/wyhash.mojoc

requirements:
  build:
    - mojo-compiler =1.0.0b3.dev2026072406
  host:
    - mojo-compiler =1.0.0b3.dev2026072406
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - mojo run -I ${{ PREFIX }}/lib/mojo mojo_tests/test_wyhash.mojo
    files:
      source:
        - mojo_tests/test_wyhash.mojo

about:
  homepage: https://github.com/lee101/mojo-wyhash
  repository: https://github.com/lee101/mojo-wyhash
  license: MIT
  license_file: LICENSE
  summary: Mojo port of wyhash final-v3 and make_secret.

extra:
  maintainers:
    - lee101
