[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
name = "mojo-wyhash"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "mojo-wyhash"
version = "0.1.0"
publish = true

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*", channels = [
    "https://conda.modular.com/max-nightly",
    "https://prefix.dev/pixi-build-backends",
    "conda-forge",
] }

[package.build.config.pkg]
name = "wyhash"
path = "src/wyhash"

[package.host-dependencies]
mojo = "==1.2.0.dev2026092605"

[package.build-dependencies]
mojo = "==1.2.0.dev2026092605"

[package.run-dependencies]
mojo = "==1.2.0.dev2026092605"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"
package = "rattler-build build --recipe conda.recipe/recipe.yaml -c https://conda.modular.com/max-nightly -c conda-forge -c https://repo.prefix.dev/modular-community"
mojo-test = "mojo run -I src mojo_tests/test_wyhash.mojo"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
python = "3.12.*"
pytest = "*"
numpy = "*"
# Local path dep so `pixi install` exercises the pixi-build-mojo package.
mojo-wyhash = { path = "." }

[pypi-dependencies]
wyhash = "==0.1.2"
